<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA14 - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #14151a;
            --accent-diamond: #55ffff;
            --accent-green: #55ff55;
            --accent-red: #ff5555;
            --text-light: #f0f0f0;
            --border-pixel: #262833;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding: 25px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 3px solid var(--border-pixel);
            padding: 20px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--accent-red);
            font-size: 1.1rem;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 10px 14px;
            background: #2a2c38;
            color: #fff;
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--accent-diamond); color: #000; }
        .btn-success { background: #1e5a20; border-color: var(--accent-green); }
        .btn-success:hover { background: var(--accent-green); color: #000; }
        .btn-danger { background: #5a1e1e; border-color: var(--accent-red); }
        .btn-danger:hover { background: var(--accent-red); color: #fff; }

        .table-container {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--border-pixel);
            font-size: 0.9rem;
        }

        th {
            background: #1c1e26;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            color: var(--accent-diamond);
        }

        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-pending { background: #664d03; color: #ffda6a; }
        .badge-done { background: #0f5132; color: #75b798; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👑 Admin Dashboard</h1>
        <button class="btn" onclick="loadOrders()">🔄 Aktualisieren</button>
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Spieler / Zeit</th>
                    <th>Items</th>
                    <th>Gesamtpreis</th>
                    <th>Koordinaten & Notiz</th>
                    <th>Status</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="admin-orders-list">
                <tr><td colspan="6" style="text-align:center; color:#777; padding: 30px;">Lade Bestellungen aus der Cloud...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // CONFIG - DIESELBEN DATEN WIE IN DER INDEX.HTML EINTRAGEN!
    const BIN_ID = "6acc136bffd5d160536295cf";
    const API_KEY = "$2a$10$gtwk9wEsW0YPPH4mQ.1/r.7StzFKPdcbFXmCvTkCKc8h4I/DWMiHW";

    async function loadOrders() {
        const tbody = document.getElementById('admin-orders-list');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding: 30px;">Lade...</td></tr>`;

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            let orders = Array.isArray(data.record) ? data.record : [];

            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding: 30px;">Keine Bestellungen vorhanden.</td></tr>`;
                return;
            }

            orders.slice().reverse().forEach((order, index) => {
                const realIndex = orders.length - 1 - index;
                const isDone = order.status === "Geliefert";

                const itemsHtml = order.cartItems 
                    ? order.cartItems.map(i => `• <b>${i.amount}x</b> ${i.name}`).join('<br>')
                    : `<b>${order.amount || 1}x</b> ${order.item || 'Item'}`;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${order.player}</strong><br>
                            <small style="color:#888;">${order.date || 'Unbekannt'}</small>
                        </td>
                        <td>${itemsHtml}</td>
                        <td style="color: var(--accent-diamond); font-weight: bold;">💎 ${order.totalPrice} Dias</td>
                        <td>
                            📍 <code style="background:#1c1e26; padding:2px 6px; border-radius:4px; color:#ff55ff;">${order.coords}</code><br>
                            <small style="color:#aaa;">📝 ${order.notes}</small>
                        </td>
                        <td>
                            <span class="badge ${isDone ? 'badge-done' : 'badge-pending'}">${order.status}</span>
                        </td>
                        <td>
                            ${!isDone ? `<button class="btn btn-success" onclick="markDelivered(${realIndex})">Ausliefern ✅</button>` : `<span style="color:#75b798; font-weight:bold;">Erledigt ✅</span>`}
                            <button class="btn btn-danger" style="margin-left: 5px;" onclick="deleteOrder(${realIndex})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 30px;">Fehler beim Laden der Daten! Prüfe deine BIN_ID und API_KEY.</td></tr>`;
