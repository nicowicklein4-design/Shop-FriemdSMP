<script>
    // CONFIG - DIESELBEN DATEN WIE IN DER INDEX.HTML EINTRAGEN!
    const BIN_ID = "6acc136bffd5d160536295cf";
    const API_KEY = "$2a$10$gtwk9wEsW0YPPH4mQ.1/r.7StzFKPdcbFXmCvTkCKc8h4I/DWMiHW";

    async function loadOrders() {
        const tbody = document.getElementById('admin-orders-list');
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding: 30px;">Lade Bestellungen aus der Cloud...</td></tr>`;

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            
            console.log("Empfangene JSONBin Daten:", json); // Hilft in F12 Konsole

            // Universeller Check: Holt die Daten egal wie JSONBin sie verpackt hat
            let orders = [];
            if (Array.isArray(json)) {
                orders = json;
            } else if (json.record && Array.isArray(json.record)) {
                orders = json.record;
            } else if (json.record && json.record.record && Array.isArray(json.record.record)) {
                orders = json.record.record;
            } else if (typeof json.record === 'object' && json.record !== null) {
                // Falls es ein einzelnes Objekt ist, in ein Array packen
                orders = [json.record];
            }

            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding: 30px;">Keine Bestellungen in der Bin gefunden.</td></tr>`;
                return;
            }

            orders.slice().reverse().forEach((order, index) => {
                const realIndex = orders.length - 1 - index;
                const isDone = order.status === "Geliefert";

                const itemsHtml = order.cartItems 
                    ? order.cartItems.map(i => `• <b>${i.amount}x</b> ${i.name}`).join('<br>')
                    : `<b>${order.amount || 1}x</b> ${order.item || 'Item'}`;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${order.player || 'Unbekannt'}</strong><br>
                            <small style="color:#888;">${order.date || 'Gerade eben'}</small>
                        </td>
                        <td>${itemsHtml}</td>
                        <td style="color: var(--accent-diamond); font-weight: bold;">💎 ${order.totalPrice || 0} Dias</td>
                        <td>
                            📍 <code style="background:#1c1e26; padding:2px 6px; border-radius:4px; color:#ff55ff;">${order.coords || 'Keine'}</code><br>
                            <small style="color:#aaa;">📝 ${order.notes || 'Keine'}</small>
                        </td>
                        <td>
                            <span class="badge ${isDone ? 'badge-done' : 'badge-pending'}">${order.status || 'Offen'}</span>
                        </td>
                        <td>
                            ${!isDone ? `<button class="btn btn-success" onclick="markDelivered(${realIndex})">Ausliefern ✅</button>` : `<span style="color:#75b798; font-weight:bold;">Erledigt ✅</span>`}
                            <button class="btn btn-danger" style="margin-left: 5px;" onclick="deleteOrder(${realIndex})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding: 30px;">Fehler beim Laden! Prüfe die F12-Konsole.</td></tr>`;
        }
    }

    async function markDelivered(index) {
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let orders = json.record || json;
            if (!Array.isArray(orders)) orders = [orders];

            orders[index].status = "Geliefert";

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(orders)
            });

            loadOrders();
        } catch (err) {
            alert("Fehler beim Aktualisieren!");
        }
    }

    async function deleteOrder(index) {
        if (!confirm("Bestellung wirklich löschen?")) return;

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let json = await res.json();
            let orders = json.record || json;
            if (!Array.isArray(orders)) orders = [orders];

            orders.splice(index, 1);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(orders)
            });

            loadOrders();
        } catch (err) {
            alert("Fehler beim Löschen!");
        }
    }

    loadOrders();
</script>
