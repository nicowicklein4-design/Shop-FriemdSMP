<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Attack 14 - Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1015;
            --card-bg: #181a20;
            --accent-diamond: #55ffff;
            --accent-green: #55ff55;
            --accent-gold: #ffaa00;
            --text-light: #f0f0f0;
            --border-pixel: #2a2d3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 20px;
            background: var(--card-bg);
            border: 3px solid var(--border-pixel);
            border-radius: 8px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--accent-diamond);
            font-size: 1.5rem;
            text-shadow: 3px 3px 0px #00aaaa;
            margin-bottom: 10px;
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .shop-layout { grid-template-columns: 1fr; }
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .item-card {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .item-price {
            color: var(--accent-diamond);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 10px;
            background: #2a2c38;
            color: #fff;
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--accent-diamond); color: #000; }
        .btn-submit { background: #1e5a20; border-color: var(--accent-green); width: 100%; font-size: 0.7rem; padding: 12px; margin-top: 15px; }
        .btn-submit:hover { background: var(--accent-green); color: #000; }

        .cart-box {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-pixel);
            padding-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: #0f1015;
            border: 1px solid var(--border-pixel);
            color: #fff;
            border-radius: 4px;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
        }

        .total-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-diamond);
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💎 CA14 Item Shop</h1>
        <p style="color: #aaa; margin-top: 5px;">Wähle deine Items, gib deine Daten ein und erhalte deine Lieferung!</p>
    </header>

    <div class="shop-layout">
        <!-- Angebote -->
        <div class="items-grid" id="items-container">
            <!-- Wird per JS geladen -->
        </div>

        <!-- Warenkorb & Checkout -->
        <div class="cart-box">
            <div class="cart-title">🛒 Warenkorb</div>
            <div id="cart-list">
                <p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>
            </div>

            <div class="total-price" id="total-price">Gesamt: 0 💎</div>

            <form id="order-form" style="margin-top: 20px;" onsubmit="handleOrder(event)">
                <label style="font-size: 0.8rem; color: #aaa;">Minecraft Name *</label>
                <input type="text" id="player-name" required placeholder="z.B. Steve">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Koordinaten (Base/Kiste) *</label>
                <input type="text" id="player-coords" required placeholder="X: 100, Y: 64, Z: -250">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Wunschbox / Notiz an Lieferant</label>
                <textarea id="player-notes" rows="2" placeholder="z.B. Kiste steht links neben dem Tor oder Extrawünsche"></textarea>

                <button type="submit" class="btn btn-submit">Bestellung Abschicken 🚀</button>
            </form>
        </div>
    </div>
</div>

<script>
    // CONFIG - TRAGE HIER DEINE DATEN EIN!
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558967810447646780/4ZCgL92Nrg6pBzTpd1Z5kc7p2vZ7rHqBEyNbN5aO3CChpzRxeKTucd7pyY0PMELTMylu";
    const BIN_ID = "6acc136bffd5d160536295cf";
    const API_KEY = "$2a$10$gtwk9wEsW0YPPH4mQ.1/r.7StzFKPdcbFXmCvTkCKc8h4I/DWMiHW";

    // Shop Sortiment
    const products = [
        { id: 1, name: "64x Elytra Repair (Phantom Membran)", price: 4 },
        { id: 2, name: "1x Totem der Unsterblichkeit", price: 8 },
        { id: 3, name: "64x Raketen (Stufe 3)", price: 2 },
        { id: 4, name: "1x Diamant Spitzhacke (Mending)", price: 12 },
        { id: 5, name: "64x Erfahrungsfläschchen", price: 6 },
        { id: 6, name: "1x Netherite Barren", price: 16 }
    ];

    let cart = [];

    function renderProducts() {
        const container = document.getElementById('items-container');
        container.innerHTML = products.map(p => `
            <div class="item-card">
                <div>
                    <div class="item-title">${p.name}</div>
                    <div class="item-price">💎 ${p.price} Dias</div>
                </div>
                <button class="btn" onclick="addToCart(${p.id})">+ Hinzufügen</button>
            </div>
        `).join('');
    }

    function addToCart(productId) {
        const item = products.find(p => p.id === productId);
        const existing = cart.find(c => c.id === productId);
        
        if (existing) {
            existing.amount++;
        } else {
            cart.push({ ...item, amount: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const cartContainer = document.getElementById('cart-list');
        const totalContainer = document.getElementById('total-price');

        if (cart.length === 0) {
            cartContainer.innerHTML = `<p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>`;
            totalContainer.innerText = "Gesamt: 0 💎";
            return;
        }

        let total = 0;
        cartContainer.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.amount;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <span><b>${item.amount}x</b> ${item.name}</span>
                    <span>💎 ${itemTotal}</span>
                </div>
            `;
        }).join('');

        totalContainer.innerText = `Gesamt: ${total} 💎`;
    }

    async function handleOrder(e) {
        e.preventDefault();
        if (cart.length === 0) {
            alert("Dein Warenkorb ist leer!");
            return;
        }

        const player = document.getElementById('player-name').value;
        const coords = document.getElementById('player-coords').value;
        const notes = document.getElementById('player-notes').value || "Keine";
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.amount), 0);

        const orderData = {
            id: Date.now(),
            player: player,
            coords: coords,
            notes: notes,
            cartItems: cart,
            totalPrice: totalPrice,
            status: "Offen",
            date: new Date().toLocaleString("de-DE")
        };

        sendDiscordWebhook(orderData);
        await sendToCloud(orderData);

        alert("Danke für deine Bestellung! Wir liefern so schnell wie möglich.");
        cart = [];
        document.getElementById('order-form').reset();
        updateCartUI();
    }

    function sendDiscordWebhook(order) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("DEIN_DISCORD")) return;

        const itemList = order.cartItems.map(i => `• **${i.amount}x** ${i.name}`).join('\n');
        
        const embed = {
            title: "🛒 Neue Bestellung eingegangen!",
            color: 5570559,
            fields: [
                { name: "👤 Spieler", value: order.player, inline: true },
                { name: "💎 Gesamtpreis", value: `${order.totalPrice} Diamanten`, inline: true },
                { name: "📍 Koordinaten", value: order.coords, inline: false },
                { name: "📝 Wunschbox / Notiz", value: order.notes, inline: false },
                { name: "📦 Bestellte Items", value: itemList, inline: false }
            ],
            footer: { text: `Bestell-ID: ${order.id} | ${order.date}` }
        };

        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(err => console.error("Webhook Fehler:", err));
    }

    async function sendToCloud(orderData) {
        if (!BIN_ID || BIN_ID.includes("DEINE_BIN")) return;

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            
            let orders = Array.isArray(data.record) ? data.record : [];
            orders.push(orderData);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(orders)
            });
        } catch (err) {
            console.error("Cloud-Speicher Fehler:", err);
        }
    }

    renderProducts();
</script>
</body>
</html>
