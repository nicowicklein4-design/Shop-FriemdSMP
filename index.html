<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Attack 14 - Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1015;
            --card-bg: #181a20;
            --accent-diamond: #55ffff;
            --accent-green: #55ff55;
            --accent-gold: #ffaa00;
            --accent-purple: #dcb0ff;
            --accent-red: #ff5555;
            --text-light: #f0f0f0;
            --border-pixel: #2a2d3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 20px;
            background: var(--card-bg);
            border: 3px solid var(--border-pixel);
            border-radius: 8px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--accent-diamond);
            font-size: 1.5rem;
            text-shadow: 3px 3px 0px #00aaaa;
            margin-bottom: 10px;
        }

        .filter-section {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-cat {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            padding: 8px 10px;
            background: #2a2c38;
            color: #aaa;
            border: 1px solid var(--border-pixel);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cat:hover, .btn-cat.active {
            background: var(--accent-diamond);
            color: #000;
            border-color: var(--accent-diamond);
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .shop-layout { grid-template-columns: 1fr; }
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .item-card {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .item-price {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .select-enchant {
            width: 100%;
            padding: 5px;
            background: #0f1015;
            border: 1px solid var(--border-pixel);
            color: #fff;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        .custom-wish-card {
            background: #1c1826;
            border: 2px dashed var(--accent-purple);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
        }

        .custom-wish-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: var(--accent-purple);
            margin-bottom: 10px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 10px;
            background: #2a2c38;
            color: #fff;
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--accent-diamond); color: #000; }
        .btn-wish { background: #4a2168; border-color: var(--accent-purple); }
        .btn-wish:hover { background: var(--accent-purple); color: #000; }
        .btn-remove { background: #5a1e1e; border-color: var(--accent-red); font-size: 0.5rem; padding: 4px 8px; }
        .btn-remove:hover { background: var(--accent-red); color: #000; }
        
        .btn-submit { background: #1e5a20; border-color: var(--accent-green); width: 100%; font-size: 0.7rem; padding: 12px; margin-top: 15px; }
        .btn-submit:hover { background: var(--accent-green); color: #000; }

        .cart-box {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-pixel);
            padding-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            border-bottom: 1px solid #222;
            padding-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: #0f1015;
            border: 1px solid var(--border-pixel);
            color: #fff;
            border-radius: 4px;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
        }

        .total-price-box {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed var(--border-pixel);
            font-size: 0.95rem;
            color: var(--accent-diamond);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💎 CA14 Item Shop</h1>
        <p style="color: #aaa; margin-top: 5px;">Rezeptgetreue Preise, Verzauberungen & Wunschbox!</p>
    </header>

    <div class="shop-layout">
        <div>
            <div class="filter-section">
                <input type="text" id="search-input" placeholder="🔍 Item suchen (English Name)..." oninput="filterProducts()">
                <div class="category-buttons" id="cat-buttons">
                    <button class="btn-cat active" onclick="setCategory('Alle', this)">Alle</button>
                    <button class="btn-cat" onclick="setCategory('Wünsche', this)">🎁 Wünsche</button>
                    <button class="btn-cat" onclick="setCategory('building blocks', this)">Building Blocks</button>
                    <button class="btn-cat" onclick="setCategory('colored blocks', this)">Colored Blocks</button>
                    <button class="btn-cat" onclick="setCategory('natural blocks', this)">Natural Blocks</button>
                    <button class="btn-cat" onclick="setCategory('functional blocks', this)">Functional</button>
                    <button class="btn-cat" onclick="setCategory('redstone blocks', this)">Redstone</button>
                    <button class="btn-cat" onclick="setCategory('tools & utilities', this)">Tools & Utilities</button>
                    <button class="btn-cat" onclick="setCategory('combat', this)">Combat</button>
                    <button class="btn-cat" onclick="setCategory('food & drinks', this)">Food & Drinks</button>
                    <button class="btn-cat" onclick="setCategory('ingredients', this)">Ingredients</button>
                </div>
            </div>

            <div class="items-grid" id="items-container">
                <p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">Lade Sortiment...</p>
            </div>

            <div class="custom-wish-card">
                <div class="custom-wish-title">🎁 Wunschbox (Submit Wish)</div>
                <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 12px;">
                    Item nicht im Shop? Trage Name & Währung (z.B. 2x Coal / 1x Iron Ingot / 1x Diamond) ein!
                </p>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
                    <input type="text" id="wish-item-name" placeholder="z. B. Beacon / Nether Star">
                    <input type="text" id="wish-item-price" placeholder="Preis (z.B. 5 Diamonds)">
                </div>
                <button class="btn btn-wish" style="margin-top: 10px; width: 100%;" onclick="submitWish()">+ Wunsch abschicken & in Shop legen</button>
            </div>
        </div>

        <div class="cart-box">
            <div class="cart-title">🛒 Warenkorb</div>
            <div id="cart-list">
                <p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>
            </div>

            <div class="total-price-box" id="total-price">
                Gesamtsumme: 0 Items
            </div>

            <form id="order-form" style="margin-top: 20px;" onsubmit="handleOrder(event)">
                <label style="font-size: 0.8rem; color: #aaa;">Minecraft Name *</label>
                <input type="text" id="player-name" required placeholder="z.B. Steve">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Koordinaten (Base/Kiste) *</label>
                <input type="text" id="player-coords" required placeholder="X: 100, Y: 64, Z: -250">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Notiz an Lieferant</label>
                <textarea id="player-notes" rows="2" placeholder="z.B. Kiste steht links neben dem Tor"></textarea>

                <button type="submit" class="btn btn-submit">Bestellung Abschicken 🚀</button>
            </form>
        </div>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558967810447646780/4ZCgL92Nrg6pBzTpd1Z5kc7p2vZ7rHqBEyNbN5aO3CChpzRxeKTucd7pyY0PMELTMylu";
    const BIN_ID = "6acc136bffd5d160536295cf";
    const API_KEY = "$2a$10$gtwk9wEsW0YPPH4mQ.1/r.7StzFKPdcbFXmCvTkCKc8h4I/DWMiHW";

    let products = [];
    let currentCategory = "Alle";
    let cart = [];

    function isEnchantable(item) {
        const name = item.name.toLowerCase();
        const enchantKeywords = ['helmet', 'chestplate', 'leggings', 'boots', 'sword', 'pickaxe', 'axe', 'shovel', 'hoe', 'bow', 'crossbow', 'trident', 'elytra', 'shield'];
        return enchantKeywords.some(keyword => name.includes(keyword));
    }

    async function loadProducts() {
        try {
            let res = await fetch('items.json');
            products = await res.json();
            
            let savedWishes = JSON.parse(localStorage.getItem('ca14_wishes') || '[]');
            products = [...savedWishes, ...products];

            renderProducts();
        } catch (err) {
            console.error("Fehler beim Laden:", err);
        }
    }

    function renderProducts() {
        const container = document.getElementById('items-container');
        const searchInput = document.getElementById('search-input').value.toLowerCase();

        const filtered = products.filter(p => {
            const matchesCat = (currentCategory === "Alle" || p.category === currentCategory);
            const matchesSearch = p.name.toLowerCase().includes(searchInput) || p.id.toLowerCase().includes(searchInput);
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 20px;">Kein Item gefunden.</p>`;
            return;
        }

        container.innerHTML = filtered.map(p => {
            let enchantHtml = '';
            if (isEnchantable(p)) {
                enchantHtml = `
                    <select class="select-enchant" id="enchant-${p.id}">
                        <option value="Ohne Verzauberung">Ohne Verzauberung</option>
                        <option value="Mending (+1 Dia)">Mending (+1 Dia)</option>
                        <option value="Unbreaking III (+1 Dia)">Unbreaking III (+1 Dia)</option>
                        <option value="Protection / Sharpness IV (+2 Dias)">Protection / Sharpness IV (+2 Dias)</option>
                        <option value="Efficiency V (+2 Dias)">Efficiency V (+2 Dias)</option>
                    </select>
                `;
            }

            return `
                <div class="item-card">
                    <div>
                        <div class="item-title">${p.name}</div>
                        <div class="item-price">💰 ${p.price}</div>
                        ${enchantHtml}
                    </div>
                    <button class="btn" onclick="addToCart('${p.id}')">+ Hinzufügen</button>
                </div>
            `;
        }).join('');
    }

    function setCategory(catName, btnElement) {
        currentCategory = catName;
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderProducts();
    }

    function filterProducts() {
        renderProducts();
    }

    function addToCart(productId) {
        const item = products.find(p => p.id === productId);
        if (!item) return;

        let enchantSelect = document.getElementById(`enchant-${productId}`);
        let selectedEnchant = enchantSelect ? enchantSelect.value : "";

        let cartItemName = item.name;
        if (selectedEnchant && selectedEnchant !== "Ohne Verzauberung") {
            cartItemName += ` [${selectedEnchant}]`;
        }

        const cartKey = `${productId}-${selectedEnchant}`;
        const existing = cart.find(c => c.cartKey === cartKey);
        
        if (existing) {
            existing.amount++;
        } else {
            cart.push({ ...item, cartKey: cartKey, customName: cartItemName, amount: 1 });
        }
        updateCartUI();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function submitWish() {
        const nameInput = document.getElementById('wish-item-name');
        const priceInput = document.getElementById('wish-item-price');

        const wishName = nameInput.value.trim();
        const wishPrice = priceInput.value.trim() || "1x Iron Ingot";

        if (!wishName) {
            alert("Bitte gib den Namen des Wunsch-Items ein!");
            return;
        }

        const newWishItem = {
            id: 'wish-' + Date.now(),
            name: `🎁 [Wunsch] ${wishName}`,
            price: wishPrice,
            category: "Wünsche"
        };

        products.unshift(newWishItem);

        let savedWishes = JSON.parse(localStorage.getItem('ca14_wishes') || '[]');
        savedWishes.push(newWishItem);
        localStorage.setItem('ca14_wishes', JSON.stringify(savedWishes));

        cart.push({ ...newWishItem, cartKey: newWishItem.id, customName: newWishItem.name, amount: 1 });
        updateCartUI();

        sendWishWebhook(newWishItem);

        nameInput.value = '';
        priceInput.value = '';
        setCategory('Wünsche', document.querySelector('.btn-cat:nth-child(2)'));
        alert("Dein Wunsch wurde eingereicht und in deinen Warenkorb gelegt!");
    }

    function updateCartUI() {
        const cartContainer = document.getElementById('cart-list');
        const totalContainer = document.getElementById('total-price');

        if (cart.length === 0) {
            cartContainer.innerHTML = `<p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>`;
            totalContainer.innerHTML = "<b>Gesamtsumme:</b> 0 Items";
            return;
        }

        let totalDiamonds = 0;
        let totalItemsCount = 0;
        let otherCosts = [];

        cartContainer.innerHTML = cart.map((item, index) => {
            totalItemsCount += item.amount;
            
            // Rechnet Diamanten zusammen, falls der Preis in "Diamonds" angegeben ist
            if (item.price.includes("Diamond")) {
                let num = parseInt(item.price) || 0;
                totalDiamonds += (num * item.amount);
            } else {
                otherCosts.push(`${item.amount}x (${item.price})`);
            }

            return `
                <div class="cart-item">
                    <span><b>${item.amount}x</b> ${item.customName || item.name}<br><small style="color:#ffaa00;">Preis: ${item.price}</small></span>
                    <button class="btn btn-remove" onclick="removeFromCart(${index})">X</button>
                </div>
            `;
        }).join('');

        let totalText = `<b>Gesamtsumme:</b> ${totalItemsCount} Positionen<br>`;
        if (totalDiamonds > 0) {
            totalText += `<span style="color:#55ffff;">💎 ${totalDiamonds} Diamonds</span>`;
        }
        if (otherCosts.length > 0) {
            if (totalDiamonds > 0) totalText += " + ";
            totalText += `<small style="color:#ffaa00;">${otherCosts.join(" + ")}</small>`;
        }

        totalContainer.innerHTML = totalText;
    }

    async function handleOrder(e) {
        e.preventDefault();
        if (cart.length === 0) {
            alert("Dein Warenkorb ist leer!");
            return;
        }

        const player = document.getElementById('player-name').value;
        const coords = document.getElementById('player-coords').value;
        const notes = document.getElementById('player-notes').value || "Keine";

        const orderData = {
            id: Date.now(),
            player: player,
            coords: coords,
            notes: notes,
            cartItems: cart,
            status: "Offen ⏳",
            date: new Date().toLocaleString("de-DE")
        };

        sendDiscordWebhook(orderData);
        await sendToCloud(orderData);

        alert("Danke für deine Bestellung!");
        cart = [];
        document.getElementById('order-form').reset();
        updateCartUI();
    }

    function sendDiscordWebhook(order) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("DEIN_DISCORD")) return;
        const itemList = order.cartItems.map(i => `• **${i.amount}x** ${i.customName || i.name} (${i.price})`).join('\n');
        
        const embed = {
            title: "🛒 Neue Bestellung eingegangen!",
            color: 5570559,
            fields: [
                { name: "👤 Spieler", value: order.player, inline: true },
                { name: "📍 Koordinaten", value: order.coords, inline: false },
                { name: "📝 Notiz", value: order.notes, inline: false },
                { name: "📦 Bestelle Items", value: itemList, inline: false }
            ],
            footer: { text: `Bestell-ID: ${order.id} | ${order.date}` }
        };

        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(err => console.error(err));
    }

    function sendWishWebhook(wish) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("DEIN_DISCORD")) return;
        const embed = {
            title: "🎁 Neuer Wunsch im Shop eingereicht!",
            color: 14487551,
            fields: [
                { name: "🎁 Wunsch-Item", value: wish.name, inline: true },
                { name: "💰 Preis/Währung", value: String(wish.price), inline: true }
            ],
            footer: { text: `ID: ${wish.id}` }
        };
        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(err => console.error(err));
    }

    async function sendToCloud(orderData) {
        if (!BIN_ID || BIN_ID.includes("DEINE_BIN")) return;
        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            let orders = Array.isArray(data.record) ? data.record : [];
            orders.push(orderData);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(orders)
            });
        } catch (err) {
            console.error("Cloud Fehler:", err);
        }
    }

    loadProducts();
</script>
</body>
</html>
