<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Attack 14 - Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1015;
            --card-bg: #181a20;
            --accent-diamond: #55ffff;
            --accent-green: #55ff55;
            --accent-gold: #ffaa00;
            --accent-purple: #dcb0ff;
            --text-light: #f0f0f0;
            --border-pixel: #2a2d3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 20px;
            background: var(--card-bg);
            border: 3px solid var(--border-pixel);
            border-radius: 8px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--accent-diamond);
            font-size: 1.5rem;
            text-shadow: 3px 3px 0px #00aaaa;
            margin-bottom: 10px;
        }

        .filter-section {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-cat {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            padding: 8px 10px;
            background: #2a2c38;
            color: #aaa;
            border: 1px solid var(--border-pixel);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cat:hover, .btn-cat.active {
            background: var(--accent-diamond);
            color: #000;
            border-color: var(--accent-diamond);
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .shop-layout { grid-template-columns: 1fr; }
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .item-card {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-title {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .item-price {
            color: var(--accent-diamond);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .custom-wish-card {
            background: #1c1826;
            border: 2px dashed var(--accent-purple);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
        }

        .custom-wish-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: var(--accent-purple);
            margin-bottom: 10px;
        }

        .btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            padding: 10px;
            background: #2a2c38;
            color: #fff;
            border: 2px solid var(--border-pixel);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--accent-diamond); color: #000; }
        .btn-wish { background: #4a2168; border-color: var(--accent-purple); }
        .btn-wish:hover { background: var(--accent-purple); color: #000; }
        .btn-submit { background: #1e5a20; border-color: var(--accent-green); width: 100%; font-size: 0.7rem; padding: 12px; margin-top: 15px; }
        .btn-submit:hover { background: var(--accent-green); color: #000; }

        .cart-box {
            background: var(--card-bg);
            border: 2px solid var(--border-pixel);
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-pixel);
            padding-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background: #0f1015;
            border: 1px solid var(--border-pixel);
            color: #fff;
            border-radius: 4px;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
        }

        .total-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-diamond);
            margin-top: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💎 CA14 Item Shop</h1>
        <p style="color: #aaa; margin-top: 5px;">Durchsuche alle Minecraft Items oder nutze die Wunschbox!</p>
    </header>

    <div class="shop-layout">
        <!-- Linke Spalte: Suche, Kategorien, Items, Wunschbox -->
        <div>
            <div class="filter-section">
                <input type="text" id="search-input" placeholder="🔍 Item suchen (z.B. Stein, Netherite, Kiste)..." oninput="filterProducts()">
                <div class="category-buttons" id="cat-buttons">
                    <button class="btn-cat active" onclick="setCategory('Alle', this)">Alle</button>
                    <button class="btn-cat" onclick="setCategory('building blocks', this)">Baublöcke</button>
                    <button class="btn-cat" onclick="setCategory('colored blocks', this)">Farblöcke</button>
                    <button class="btn-cat" onclick="setCategory('natural blocks', this)">Natur</button>
                    <button class="btn-cat" onclick="setCategory('functional blocks', this)">Funktional</button>
                    <button class="btn-cat" onclick="setCategory('redstone blocks', this)">Redstone</button>
                    <button class="btn-cat" onclick="setCategory('tools & utilities', this)">Werkzeuge</button>
                    <button class="btn-cat" onclick="setCategory('combat', this)">Kampf</button>
                    <button class="btn-cat" onclick="setCategory('food & drinks', this)">Essen & Tränke</button>
                    <button class="btn-cat" onclick="setCategory('ingredients', this)">Zutaten</button>
                </div>
            </div>

            <div class="items-grid" id="items-container">
                <p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">Lade Sortiment aus items.json...</p>
            </div>

            <!-- Wunschbox -->
            <div class="custom-wish-card">
                <div class="custom-wish-title">🎁 Wunschbox (Sonderbestellung)</div>
                <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 12px;">
                    Nicht in der Liste gefunden? Trage dein Wunsch-Item und deinen Preis ein!
                </p>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
                    <input type="text" id="wish-item-name" placeholder="z. B. 1x Beacon / Sonderwunsch">
                    <input type="number" id="wish-item-price" placeholder="Preis (Dias)" min="1">
                </div>
                <button class="btn btn-wish" style="margin-top: 10px; width: 100%;" onclick="addWishToCart()">+ Wunsch in Warenkorb legen</button>
            </div>
        </div>

        <!-- Rechte Spalte: Warenkorb & Checkout -->
        <div class="cart-box">
            <div class="cart-title">🛒 Warenkorb</div>
            <div id="cart-list">
                <p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>
            </div>

            <div class="total-price" id="total-price">Gesamt: 0 💎</div>

            <form id="order-form" style="margin-top: 20px;" onsubmit="handleOrder(event)">
                <label style="font-size: 0.8rem; color: #aaa;">Minecraft Name *</label>
                <input type="text" id="player-name" required placeholder="z.B. Steve">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Koordinaten (Base/Kiste) *</label>
                <input type="text" id="player-coords" required placeholder="X: 100, Y: 64, Z: -250">

                <label style="font-size: 0.8rem; color: #aaa; margin-top: 10px; display:block;">Notiz an Lieferant</label>
                <textarea id="player-notes" rows="2" placeholder="z.B. Kiste steht links neben dem Tor"></textarea>

                <button type="submit" class="btn btn-submit">Bestellung Abschicken 🚀</button>
            </form>
        </div>
    </div>
</div>

<script>
    // CONFIG - TRAGE HIER DEINE DATEN EIN!
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1558967810447646780/4ZCgL92Nrg6pBzTpd1Z5kc7p2vZ7rHqBEyNbN5aO3CChpzRxeKTucd7pyY0PMELTMylu";
    const BIN_ID = "6acc136bffd5d160536295cf";
    const API_KEY = "$2a$10$gtwk9wEsW0YPPH4mQ.1/r.7StzFKPdcbFXmCvTkCKc8h4I/DWMiHW";

    let products = [];
    let currentCategory = "Alle";
    let cart = [];

    // items.json laden beim Start der Seite
    async function loadProducts() {
        try {
            let res = await fetch('items.json');
            if (!res.ok) throw new Error("Netzwerk-Antwort war nicht ok");
            products = await res.json();
            renderProducts();
        } catch (err) {
            console.error("Fehler beim Laden von items.json:", err);
            document.getElementById('items-container').innerHTML = `
                <p style="color:red; grid-column:1/-1; text-align:center; padding: 20px;">
                    <b>Fehler:</b> Konnte 'items.json' nicht laden. Stelle sicher, dass die Datei im selben Ordner auf GitHub liegt!
                </p>`;
        }
    }

    function renderProducts() {
        const container = document.getElementById('items-container');
        const searchInput = document.getElementById('search-input').value.toLowerCase();

        const filtered = products.filter(p => {
            const matchesCat = (currentCategory === "Alle" || p.category === currentCategory);
            const matchesSearch = p.name.toLowerCase().includes(searchInput) || p.id.toLowerCase().includes(searchInput);
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 20px;">Kein Item gefunden. Nutze die <b>Wunschbox</b> unten!</p>`;
            return;
        }

        container.innerHTML = filtered.map(p => `
            <div class="item-card">
                <div>
                    <div class="item-title">${p.name}</div>
                    <div class="item-price">💎 ${p.price} Dias</div>
                </div>
                <button class="btn" onclick="addToCart('${p.id}')">+ Hinzufügen</button>
            </div>
        `).join('');
    }

    function setCategory(catName, btnElement) {
        currentCategory = catName;
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderProducts();
    }

    function filterProducts() {
        renderProducts();
    }

    function addToCart(productId) {
        const item = products.find(p => p.id === productId);
        if (!item) return;

        const existing = cart.find(c => c.id === productId);
        if (existing) {
            existing.amount++;
        } else {
            cart.push({ ...item, amount: 1 });
        }
        updateCartUI();
    }

    function addWishToCart() {
        const nameInput = document.getElementById('wish-item-name');
        const priceInput = document.getElementById('wish-item-price');

        const wishName = nameInput.value.trim();
        const wishPrice = parseInt(priceInput.value);

        if (!wishName) {
            alert("Bitte gib den Namen deines Wunsch-Items ein!");
            return;
        }
        if (isNaN(wishPrice) || wishPrice <= 0) {
            alert("Bitte gib einen gültigen Preis in Diamanten ein!");
            return;
        }

        cart.push({
            id: 'wish-' + Date.now(),
            name: `🎁 [Wunsch] ${wishName}`,
            price: wishPrice,
            amount: 1
        });

        nameInput.value = '';
        priceInput.value = '';
        updateCartUI();
    }

    function updateCartUI() {
        const cartContainer = document.getElementById('cart-list');
        const totalContainer = document.getElementById('total-price');

        if (cart.length === 0) {
            cartContainer.innerHTML = `<p style="color: #777; font-size: 0.85rem;">Dein Warenkorb ist noch leer.</p>`;
            totalContainer.innerText = "Gesamt: 0 💎";
            return;
        }

        let total = 0;
        cartContainer.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.amount;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <span><b>${item.amount}x</b> ${item.name}</span>
                    <span>💎 ${itemTotal}</span>
                </div>
            `;
        }).join('');

        totalContainer.innerText = `Gesamt: ${total} 💎`;
    }

    async function handleOrder(e) {
        e.preventDefault();
        if (cart.length === 0) {
            alert("Dein Warenkorb ist leer!");
            return;
        }

        const player = document.getElementById('player-name').value;
        const coords = document.getElementById('player-coords').value;
        const notes = document.getElementById('player-notes').value || "Keine";
        const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.amount), 0);

        const orderData = {
            id: Date.now(),
            player: player,
            coords: coords,
            notes: notes,
            cartItems: cart,
            totalPrice: totalPrice,
            status: "Offen",
            date: new Date().toLocaleString("de-DE")
        };

        sendDiscordWebhook(orderData);
        await sendToCloud(orderData);

        alert("Danke für deine Bestellung! Wir liefern so schnell wie möglich.");
        cart = [];
        document.getElementById('order-form').reset();
        updateCartUI();
    }

    function sendDiscordWebhook(order) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("DEIN_DISCORD")) return;

        const itemList = order.cartItems.map(i => `• **${i.amount}x** ${i.name}`).join('\n');
        
        const embed = {
            title: "🛒 Neue Bestellung eingegangen!",
            color: 5570559,
            fields: [
                { name: "👤 Spieler", value: order.player, inline: true },
                { name: "💎 Gesamtpreis", value: `${order.totalPrice} Diamanten`, inline: true },
                { name: "📍 Koordinaten", value: order.coords, inline: false },
                { name: "📝 Notiz", value: order.notes, inline: false },
                { name: "📦 Bestellte Items", value: itemList, inline: false }
            ],
            footer: { text: `Bestell-ID: ${order.id} | ${order.date}` }
        };

        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embed] })
        }).catch(err => console.error("Webhook Fehler:", err));
    }

    async function sendToCloud(orderData) {
        if (!BIN_ID || BIN_ID.includes("DEINE_BIN")) return;

        try {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            let data = await res.json();
            
            let orders = Array.isArray(data.record) ? data.record : [];
            orders.push(orderData);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(orders)
            });
        } catch (err) {
            console.error("Cloud-Speicher Fehler:", err);
        }
    }

    // Beim Laden ausführen
    loadProducts();
</script>
</body>
</html>
